{% extends 'ecom/customer_base.html' %}
{% load static %}
{% block content %}

<style>
  .page-wrap { max-width: 1180px; margin: 44px auto; padding: 0 18px; }
  /* Match My Profile two-column layout */
  .profile-grid { display: grid; grid-template-columns: 280px 1fr; gap: 22px; }
  .sidebar { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
  .sidebar-title { font-weight:700; color:#374151; font-size:1.12rem; margin-bottom:10px; }
  .side-link { display:block; padding:12px 14px; border-radius:8px; color:#374151; text-decoration:none; font-weight:600; font-size:1.15rem; }
  .side-link:hover { background:#f3f4f6; }
  .side-link.active { background:#f3f4f6; }

  .content-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; }
  .content-head { padding:20px 20px 14px 20px; border-bottom:1px solid #e5e7eb; }
  .content-title { font-size:1.5rem; font-weight:700; color:#111827; }
  .content-sub { color:#6b7280; font-size:1.12rem; }
  .content-body { padding:20px; }
  .form-group { margin-bottom:16px; position:relative; }
  .form-control { width:100%; border:1px solid #d1d5db; border-radius:12px; padding:12px 14px; background:#f9fafb; font-size:1.12rem; }
  .form-control:focus { outline:none; border-color:#2563eb; background:#fff; }
  .actions { display:flex; gap:12px; margin-top:12px; }
  .btn-primary { background:#2563eb; color:#fff; padding:12px 20px; border:none; border-radius:10px; font-weight:700; }
  .btn-secondary { background:#6b7280; color:#fff; padding:10px 16px; border:none; border-radius:10px; font-weight:600; text-decoration:none; }
  :where(.content-card) { font-size: 1.15rem; }
</style>

<div class="page-wrap">
  <div class="profile-grid">
    <!-- Left sidebar: My Account with only Change Password -->
    <aside class="sidebar">
      <div class="sidebar-title">My Account</div>
      <a href="{% url 'change-password' %}" class="side-link active">Change Password</a>
    </aside>

    <!-- Right content: Change Password form -->
    <div class="content-card">
      <div class="content-head">
        <div class="content-title">My Account</div>
        <div class="content-sub">Change your password</div>
      </div>
      <div class="content-body">
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-success" style="margin-bottom:10px;">{{ message }}</div>
          {% endfor %}
        {% endif %}
        <form method="post" action="{% url 'change-password' %}">
          {% csrf_token %}
          <div class="form-group">
            <label for="old_password">Old Password</label>
            <input type="password" id="old_password" name="old_password" class="form-control" autocomplete="current-password" required>
          </div>
          <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirm_new_password">Repeat New Password</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary">Save New Password</button>
            <a href="{% url 'my-profile' %}" class="btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
